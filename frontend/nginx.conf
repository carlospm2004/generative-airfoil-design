server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Las peticiones a /api/... se reenvían al servicio de la API.
    # La barra final de proxy_pass quita el prefijo: /api/perfiles -> http://api:8000/perfiles
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
